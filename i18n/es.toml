[about_crumb]
other = "Nosotros"
[about_h1]
other = "Acerca de Bridge"
[about_sub]
other = "Una red de escuelas públicas chárter sin fines de lucro comprometida con demostrar lo posible — altas expectativas, gratuita, para cada estudiante de nuestra comunidad."
[about_mv_h2]
other = "Misión y visión"
[about_mv_lead]
other = "Por qué existe Bridge y el futuro que construimos — junto a las familias y la comunidad."
[about_mission_lbl]
other = "Nuestra misión"
[about_mission_p]
other = "Bridge Public Schools ofrece escuelas públicas gratuitas, de inscripción abierta y altas expectativas en comunidades históricamente desatendidas que preparan a cada estudiante para el éxito en la universidad y en la vida."
[about_vision_lbl]
other = "Nuestra visión"
[about_vision_p]
other = "Cada niño, sin importar su código postal, tendrá acceso equitativo a una educación pública excelente que forma pensadores poderosos, ciudadanos compasivos y líderes seguros que triunfan en la universidad y más allá."
[about_values_h2]
other = "Nuestros valores"
[about_values_lead]
other = "Cuatro compromisos — las cuatro C — que guían cómo trabajamos con las familias, los estudiantes y la comunidad cada día."
[about_val1_p]
other = "Comunicamos con transparencia a las familias, los estudiantes y la comunidad."
[about_val2_p]
other = "Creamos entornos afectuosos y culturalmente receptivos donde todos los estudiantes pertenecen."
[about_val3_p]
other = "Forjamos la autonomía estudiantil con académicos rigurosos y resultados medibles."
[about_val4_p]
other = "Formamos líderes éticos que aportan positivamente a sus comunidades."
[about_lead_h2]
other = "Liderazgo"
[about_lead_lead]
other = "Bridge está dirigida por un líder experimentado de sistemas K–12 con un historial de fundar y expandir escuelas de alto rendimiento."
[about_founder_kick]
other = "Fundador y director ejecutivo"
[about_founder_role]
other = "Casi tres décadas de liderazgo en educación pública"
[about_founder_p1]
other = "Bridge Public Schools está dirigida por su fundador y director ejecutivo Rolando Posada, un líder experimentado de sistemas K–12 con un historial comprobado de fundar, dirigir y expandir escuelas de alto rendimiento que atienden predominantemente a estudiantes de bajos ingresos. El Sr. Posada aporta casi tres décadas de experiencia en todo el continuo del liderazgo en educación pública, incluyendo la instrucción en el aula, la transformación de escuelas, la gestión regional y la supervisión de sistemas en varios estados."
[about_founder_p2]
other = "Comenzó su carrera como maestro bilingüe de primaria y rápidamente demostró la capacidad de lograr sólidos resultados académicos para los aprendices de inglés y los estudiantes de comunidades desatendidas. Su trayectoria de liderazgo incluye transformaciones exitosas de planteles como director y ascensos a cargos ejecutivos y regionales, donde ayudó a fundar 30 escuelas en nueve años, formó canteras de líderes y supervisó sistemas académicos que lograron que el 100% de los graduados se matriculara en la universidad cada año en su región."
[about_founder_p3]
other = "Su historia personal como hijo de padres inmigrantes y primer graduado universitario de su familia nutre el compromiso inquebrantable de Bridge Public Schools con la equidad, la excelencia y los resultados — y la convicción de que podemos demostrar lo posible para los estudiantes de Washington."
[about_founder_tag]
other = "Cada niño. Rumbo a la universidad."
[about_founder_btn]
other = "Conozca nuestra Junta"
[about_cta_kick]
other = "Sea parte"
[about_cta_h2]
other = "Únase a nuestra lista de interés"
[about_cta_p]
other = "Manténgase cerca mientras Bridge toma forma en Yakima. Compartiremos fechas de inscripción, sesiones informativas y noticias para su familia."

