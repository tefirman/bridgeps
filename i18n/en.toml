other = "Nearly three decades of public-education leadership"
[about_founder_p1]
other = "Bridge Public Schools is led by Founder and Chief Executive Officer Rolando Posada, an experienced K–12 system leader with a demonstrated record of launching, leading, and scaling high-performing schools serving predominantly low-income students. Mr. Posada brings nearly three decades of experience across the full continuum of public education leadership, including classroom instruction, school turnaround, regional management, and multi-state system oversight."
[about_founder_p2]
other = "He began his career as a bilingual elementary teacher and quickly demonstrated the ability to drive strong academic outcomes for English learners and students from underserved backgrounds. His leadership trajectory includes successful campus turnarounds as a principal and promotion to executive and regional roles, where he helped launch 30 schools in nine years, built leadership pipelines, and oversaw academic systems that resulted in 100% of seniors matriculating to college annually across his region."
[about_founder_p3]
other = "His personal background as the son of immigrant parents and a first-generation college graduate informs Bridge Public Schools' unwavering commitment to equity, excellence, and results — and the belief that we can prove the possible for Washington's students."
